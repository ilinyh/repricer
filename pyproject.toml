[project]
name = "repricer"
version = "0.1.0"
description = "Prototype repricer for a marketplace (Wildberries emulator)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "emulator_wb/tests"]
addopts = "-q"
